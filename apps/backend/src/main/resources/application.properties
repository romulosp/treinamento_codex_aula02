quarkus.application.name=gerenciar-categorias

# Configurações padrão
quarkus.log.level=DEBUG
quarkus.http.cors=true
ambiente=local
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/swagger_gerenciar-categorias.json
quarkus.index-dependency.yaml.group-id=com.fasterxml.jackson.jakarta.rs
quarkus.index-dependency.yaml.artifact-id=jackson-jakarta-rs-yaml-provider
quarkus.http.port=8080
quarkus.http.test-port=8083
proxy.uri=http://proxydes.caixa:80

# Pool de conexões
quarkus.datasource.metrics.enabled=true
quarkus.datasource.jdbc.background-validation-interval=1m
quarkus.datasource.jdbc.initial-size=15
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=60
quarkus.datasource.jdbc.acquisition-timeout=5s
quarkus.hibernate-orm.validate-in-dev-mode=false

# Datasource padrão: valores fornecidos pelo ambiente, sem segredos no repositório.
quarkus.datasource.db-kind=db2
quarkus.datasource.jdbc.driver=com.ibm.db2.jcc.DB2Driver
quarkus.datasource.jdbc.url=${DB2_JDBC_URL:}
quarkus.datasource.username=${DB2_USERNAME:}
quarkus.datasource.password=${DB2_PASSWORD:}
quarkus.datasource.jdbc.new-connection-sql=SELECT 1 FROM SYSIBM.SYSDUMMY1 WITH UR
quarkus.hibernate-orm.database.generation=none
quarkus.ssl.native=false

# Desenvolvimento
%dev.quarkus.ssl.native=false

# Testes: banco isolado em memória, sem dependência de DB2 externo.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:GERENCIAR_CATEGORIAS;INIT=CREATE SCHEMA IF NOT EXISTS GERENCIAR_CATEGORIAS;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.jdbc.initial-size=1
%test.quarkus.datasource.jdbc.min-size=1
%test.quarkus.datasource.jdbc.max-size=13
%test.quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
%test.quarkus.hibernate-orm.log.sql=true
%test.quarkus.hibernate-orm.database.default-schema=GERENCIAR_CATEGORIAS
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.ssl.native=false
