quarkus.application.name=gerenciar-tarefas
quarkus.smallrye-openapi.path=/swagger_gerenciar-tarefas.json
quarkus.swagger-ui.always-include=true
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${env.POSTGRESQL_JDBC_URL}
quarkus.datasource.username=${env.POSTGRESQL_USERNAME}
quarkus.datasource.password=${env.POSTGRESQL_PASSWORD}
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:tarefas;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.http.test-port=8081
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.auth-server-url=http://localhost:8180/realms/test
%test.quarkus.oidc.client-id=gerenciar-tarefas-test
%test.quarkus.oidc.credentials.secret=test-only-secret

# OIDC configuration (environment variables must be set)
quarkus.oidc.auth-server-url=${env.OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=${env.OIDC_CLIENT_ID}
quarkus.oidc.credentials.secret=${env.OIDC_CLIENT_SECRET}
quarkus.oidc.roles.role-claim-path=groups
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
